# Copyright 2026 YurilLAB. New BinaryRat workflow.
name: BinaryRat

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# No cancellation: every newly pushed BinaryRat first-parent commit is tested.
concurrency:
  group: binaryrat-${{ github.run_id }}
  cancel-in-progress: false

# Each job builds and downloads first, then marks itself ready. Every check after
# that runs even if another check failed, so one red step never hides the rest.
# Every command has its own timeout, so a hang fails in its own step.
# Downloads are hash-pinned and retried (binaryrat/tools/pinned_download.py), and
# binaryrat/tools/test_ci_workflow.py fails if CI stops running a BinaryRat check.

jobs:
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revisions: ${{ steps.revisions.outputs.revisions }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: revisions
        name: Enumerate every new BinaryRat commit
        timeout-minutes: 5
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: python
        run: |
          import json, os, subprocess
          before, after = os.environ.get("BEFORE", ""), os.environ["AFTER"]
          if before and set(before) != {"0"}:
              subprocess.run(["git", "merge-base", "--is-ancestor", before, after], check=True)
              revisions = subprocess.check_output(
                  ["git", "rev-list", "--reverse", "--first-parent", f"{before}..{after}"],
                  text=True).splitlines()
          else:
              revisions = [after]
          if not revisions or len(revisions) > 64:
              raise SystemExit("Push 1–64 first-parent commits at a time; no commit may be silently omitted.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("revisions=" + json.dumps(revisions) + "\n")

  verify:
    needs: commits
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(needs.commits.outputs.revisions) }}
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows verification takes 48-83 minutes; leave room for slower runners.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the hash-pinned Temurin JDK that the bundle ships
        timeout-minutes: 10
        run: python binaryrat/tools/install_jdk.py --github-env
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - if: runner.os == 'Linux'
        name: Install compiler and AArch64 cross-toolchain matrix
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu xvfb xauth
      - name: Build native C++ engine
        timeout-minutes: 10
        run: cmake -S binaryrat -B build/binaryrat
      - timeout-minutes: 20
        run: cmake --build build/binaryrat --config Release --parallel 2
      - name: Build and install the offline analyst wheel and benchmark dependencies
        timeout-minutes: 10
        run: |
          python -m pip wheel --only-binary=z3-solver --wheel-dir build/wheelhouse "./binaryrat/python[proof]"
          python -m pip install --no-index --find-links build/wheelhouse "binaryrat[proof]"
          python -m pip install -r binaryrat/requirements-test.txt
      - if: runner.os == 'Linux'
        name: GCC, Clang and AArch64 corpus with separate debug oracles
        timeout-minutes: 20
        run: python binaryrat/tools/build_corpus.py --output build/corpus --toolchain gcc --toolchain clang --toolchain gcc-aarch64
      - if: runner.os == 'Linux'
        name: Calibration source families from hash-pinned archives, with separate debug oracles
        timeout-minutes: 15
        run: python binaryrat/tools/build_families.py --output build/families
      - if: runner.os == 'Windows'
        name: MSVC PE/PDB corpus with separate debug oracles
        timeout-minutes: 20
        run: python binaryrat/tools/build_corpus.py --output build/corpus --toolchain msvc
      - name: Download and verify official Ghidra 12.2 baseline
        timeout-minutes: 15
        run: python binaryrat/tools/fetch_ghidra.py --output build/ghidra
      - name: Download the pinned Gradle distribution, retrying network failures
        timeout-minutes: 15
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          wrapper = str(Path("gradlew.bat" if os.name == "nt" else "gradlew").resolve())
          subprocess.run([sys.executable, "binaryrat/tools/retry_command.py", "--",
                          wrapper, "--version", "--no-daemon"], check=True)
      - id: ready
        name: Builds and downloads are complete
        timeout-minutes: 1
        run: echo "Each check below runs unless setup or a check whose output it reads failed."
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Authorship, upstream licenses and dependency integrity
        timeout-minutes: 10
        run: python binaryrat/tools/check_repository.py --commit HEAD
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Native C++ tests
        timeout-minutes: 20
        run: ctest --test-dir build/binaryrat -C Release --output-on-failure --timeout 600
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Python API and live native-client tests
        timeout-minutes: 20
        env:
          BINARYRAT_REQUIRE_Z3: '1'
          BINARYRAT_ENGINE: ${{ github.workspace }}/build/binaryrat/${{ runner.os == 'Windows' && 'Release/binaryrat-engine.exe' || 'binaryrat-engine' }}
        run: python -m unittest discover -s binaryrat/python/tests -p "test_*.py"
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Corpus, download and CI coverage tooling tests
        timeout-minutes: 10
        run: python -m unittest discover -s binaryrat/tools -p "test_*.py"
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Integration verifier tests
        timeout-minutes: 15
        run: python -m unittest discover -s binaryrat/benchmarks -p 'test_*.py'
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Exercise the live Python API and local JVM service
        timeout-minutes: 20
        env:
          BINARYRAT_REQUIRE_Z3: '1'
          BINARYRAT_GHIDRA_INSTALL_DIR: ${{ github.workspace }}/build/ghidra/ghidra_12.2_PUBLIC
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          install = Path(os.environ["BINARYRAT_GHIDRA_INSTALL_DIR"])
          wheels = install / "Ghidra/Features/PyGhidra/pypkg/dist"
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-index",
                          "--find-links", str(wheels), "pyghidra==3.2.0"], check=True)
          subprocess.run([sys.executable, "-m", "unittest", "discover",
                          "-s", "binaryrat/python/tests", "-p", "test_live*.py"], check=True)
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        id: accuracy
        name: Verify p-code layouts against separate DWARF and PDB oracles
        timeout-minutes: 20
        run: python binaryrat/benchmarks/verify_type_accuracy.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --corpus build/corpus/manifest.json --output build/ghidra-report/type-accuracy --engine ${{ github.workspace }}/build/binaryrat/${{ runner.os == 'Windows' && 'Release/binaryrat-engine.exe' || 'binaryrat-engine' }}
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.accuracy.outcome == 'success' }}
        name: Record confidence calibration coverage for the packed-layout cohort
        timeout-minutes: 10
        shell: bash
        run: |
          python binaryrat/benchmarks/stage_packed_calibration.py \
            --manifest build/corpus/manifest.json \
            --accuracy-report build/ghidra-report/type-accuracy/report.json \
            > build/ghidra-report/type-accuracy/packed-cases.json
          python binaryrat/benchmarks/calibrate_type_confidence.py \
            --input build/ghidra-report/type-accuracy/packed-cases.json \
            > build/ghidra-report/type-accuracy/confidence.json
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.ready.outcome == 'success' }}
        name: Measure layout score calibration on held-out source families
        timeout-minutes: 30
        run: python binaryrat/benchmarks/verify_family_calibration.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --engine build/binaryrat/binaryrat-engine --families build/families/manifest.json --output build/ghidra-report/family-calibration
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Verify Itanium and MSVC C++ RTTI recovery
        timeout-minutes: 20
        run: python binaryrat/benchmarks/verify_rtti.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --corpus build/corpus/manifest.json --output build/ghidra-report/rtti
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.ready.outcome == 'success' }}
        name: Verify bounded multi-hop layout recovery on x86-64 and AArch64
        timeout-minutes: 20
        shell: bash
        run: |
          python binaryrat/benchmarks/verify_interprocedural_layout.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --engine build/binaryrat/binaryrat-engine --output build/ghidra-report/interprocedural-x86-64
          python binaryrat/benchmarks/verify_interprocedural_layout.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --engine build/binaryrat/binaryrat-engine --output build/ghidra-report/interprocedural-aarch64 --cc aarch64-linux-gnu-gcc --strip aarch64-linux-gnu-strip
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.ready.outcome == 'success' }}
        name: Verify summary-based layout recovery through call cycles on x86-64 and AArch64
        timeout-minutes: 20
        shell: bash
        run: |
          python binaryrat/benchmarks/verify_summary_layout.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --engine build/binaryrat/binaryrat-engine --output build/ghidra-report/summary-x86-64
          python binaryrat/benchmarks/verify_summary_layout.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --engine build/binaryrat/binaryrat-engine --output build/ghidra-report/summary-aarch64 --cc aarch64-linux-gnu-gcc --strip aarch64-linux-gnu-strip
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        id: extension_build
        name: Build the installable BinaryRat extension
        timeout-minutes: 20
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/build/ghidra/ghidra_12.2_PUBLIC
          BINARYRAT_ENGINE: ${{ github.workspace }}/build/binaryrat/${{ runner.os == 'Windows' && 'Release/binaryrat-engine.exe' || 'binaryrat-engine' }}
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path
          wrapper = str(Path("gradlew.bat" if os.name == "nt" else "gradlew").resolve())
          subprocess.run([wrapper, "-p", "binaryrat/bridge", "--no-daemon", "buildExtension",
                          "-PbinaryratEngine=" + os.environ["BINARYRAT_ENGINE"]], check=True)
      - if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
        id: extension
        name: Verify the installed extension on official Ghidra
        timeout-minutes: 30
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/build/ghidra/ghidra_12.2_PUBLIC
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          archive, = Path("binaryrat/bridge/dist").glob("BinaryRat-ghidra-*.zip")
          subprocess.run([sys.executable, "binaryrat/benchmarks/verify_extension.py",
                          "--ghidra", os.environ["GHIDRA_INSTALL_DIR"], "--archive", str(archive),
                          "--corpus", "build/corpus/manifest.json",
                          "--output", "build/ghidra-report/extension"], check=True)
      - if: ${{ !cancelled() && steps.extension_build.outcome == 'success' }}
        name: Recover a layout at the CodeBrowser cursor and navigate to its evidence
        timeout-minutes: 20
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          archive, = Path("binaryrat/bridge/dist").glob("BinaryRat-ghidra-*.zip")
          display = [] if os.name == "nt" else ["xvfb-run", "-a"]
          subprocess.run([*display, sys.executable, "binaryrat/benchmarks/verify_gui_layout.py",
                          "--ghidra", "build/ghidra/ghidra_12.2_PUBLIC", "--archive", str(archive),
                          "--corpus", "build/corpus/manifest.json", "--output", "build/ghidra-report/gui-layout"],
                         check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaryrat-extension-${{ matrix.os }}-${{ matrix.revision }}
          path: |
            binaryrat/bridge/dist/BinaryRat-ghidra-*.zip
            binaryrat/bridge/dist/BinaryRat-ghidra-*.zip.sha256
          if-no-files-found: error
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.ready.outcome == 'success' }}
        name: Verify exact stock output on the pinned LLVM 19 large-binary sample
        timeout-minutes: 20
        env:
          BINARYRAT_REQUIRE_VERIFIED_OVERLAP: '1'
        shell: bash
        run: |
          archive=build/llvm19-fixture/libllvm19.deb
          library=build/llvm19-fixture/libLLVM.so.19.1
          python binaryrat/tools/pinned_download.py --output "$archive" \
            --url 'https://deb.debian.org/debian/pool/main/l/llvm-toolchain-19/libllvm19_19.1.7-3+b1_amd64.deb' \
            --sha256 db0d614d61345ca710fb73e75105f1ec6e38898fa7b3aa99fa7eb7d8b0a11d57
          dpkg-deb --fsys-tarfile "$archive" | tar -xOf - ./usr/lib/x86_64-linux-gnu/libLLVM.so.19.1 >"$library"
          python binaryrat/benchmarks/verify_large_llvm.py \
            --library "$library" --ghidra build/ghidra/ghidra_12.2_PUBLIC \
            --engine build/binaryrat/binaryrat-engine --output build/ghidra-report/llvm19
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        id: parity
        name: Stock versus BinaryRat Ghidra integration and benchmark evidence
        timeout-minutes: 110
        env:
          BINARYRAT_REQUIRE_VERIFIED_OVERLAP: '1'
        run: python binaryrat/benchmarks/verify_ghidra.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --corpus build/corpus/manifest.json --output build/ghidra-report --workers 1 2 4 --repetitions 1 --engine ${{ github.workspace }}/build/binaryrat/${{ runner.os == 'Windows' && 'Release/binaryrat-engine.exe' || 'binaryrat-engine' }}
      - if: ${{ !cancelled() && steps.parity.outcome == 'success' && steps.extension.outcome == 'success' }}
        name: Verify BinaryRat analyst commands against real exports and layout evidence
        timeout-minutes: 15
        run: python binaryrat/benchmarks/verify_analyst_tools.py --exports-dir build/ghidra-report --layout build/ghidra-report/extension/installed-layout.json --output build/ghidra-report/analyst-tools.json
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaryrat-analyst-wheel-${{ matrix.revision }}
          path: build/wheelhouse/binaryrat-*-py3-none-any.whl
          if-no-files-found: error
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Reopen a cached Ghidra project after an offline edit
        timeout-minutes: 20
        env:
          BINARYRAT_ENGINE: ${{ github.workspace }}/build/binaryrat/${{ runner.os == 'Windows' && 'Release/binaryrat-engine.exe' || 'binaryrat-engine' }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, "binaryrat/benchmarks/verify_cache_reopen.py",
              "--engine", os.environ["BINARYRAT_ENGINE"], "--ghidra", "build/ghidra/ghidra_12.2_PUBLIC",
              "--corpus", "build/corpus/manifest.json", "--output", "build/ghidra-report/cache-reopen"], check=True)
      - if: ${{ !cancelled() && steps.parity.outcome == 'success' }}
        name: Native artifact roundtrip, restart and invalidation benchmark
        timeout-minutes: 15
        env:
          BINARYRAT_ENGINE: ${{ github.workspace }}/build/binaryrat/${{ runner.os == 'Windows' && 'Release/binaryrat-engine.exe' || 'binaryrat-engine' }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, "binaryrat/benchmarks/benchmark_native.py",
              "--engine", os.environ["BINARYRAT_ENGINE"], "--exports-dir", "build/ghidra-report",
              "--output", "build/ghidra-report/native-cache.json"], check=True)
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaryrat-${{ matrix.os }}-${{ matrix.revision }}
          path: |
            build/corpus
            build/ghidra-report
            build/binaryrat/Testing/Temporary
          if-no-files-found: warn

  windows-aarch64-corpus:
    needs: commits
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(needs.commits.outputs.revisions) }}
    runs-on: windows-latest
    # Recent runs took 37-61 minutes, most of it in the parity step.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the hash-pinned Temurin JDK that the bundle ships
        timeout-minutes: 10
        run: python binaryrat/tools/install_jdk.py --github-env
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build host-native C++ engine for cross-target import tests
        timeout-minutes: 10
        run: cmake -S binaryrat -B build/binaryrat
      - timeout-minutes: 20
        run: cmake --build build/binaryrat --config Release --parallel 2
      - name: Install Python API and pinned benchmark dependencies
        timeout-minutes: 10
        run: python -m pip install -e binaryrat/python -r binaryrat/requirements-test.txt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64_arm64
      - name: Compile and strip real AArch64 PE/PDB fixture pairs
        timeout-minutes: 20
        run: python binaryrat/tools/build_corpus.py --output build/corpus --toolchain msvc-aarch64
      - name: Download and verify official Ghidra 12.2 baseline
        timeout-minutes: 15
        run: python binaryrat/tools/fetch_ghidra.py --output build/ghidra
      - id: ready
        name: Builds and downloads are complete
        timeout-minutes: 1
        run: echo "Each check below runs unless setup failed."
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Verify AArch64 p-code layouts against separate PDB oracles
        timeout-minutes: 20
        run: python binaryrat/benchmarks/verify_type_accuracy.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --corpus build/corpus/manifest.json --output build/ghidra-report/type-accuracy --engine ${{ github.workspace }}/build/binaryrat/Release/binaryrat-engine.exe
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Verify AArch64 MSVC C++ RTTI recovery
        timeout-minutes: 20
        run: python binaryrat/benchmarks/verify_rtti.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --corpus build/corpus/manifest.json --output build/ghidra-report/rtti
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Import AArch64 PE and verify stock versus parallel output
        timeout-minutes: 100
        run: python binaryrat/benchmarks/verify_ghidra.py --ghidra build/ghidra/ghidra_12.2_PUBLIC --corpus build/corpus/manifest.json --output build/ghidra-report --workers 1 2 4 --repetitions 1 --engine ${{ github.workspace }}/build/binaryrat/Release/binaryrat-engine.exe
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaryrat-windows-aarch64-${{ matrix.revision }}
          path: |
            build/corpus
            build/ghidra-report
          if-no-files-found: error

  build-ghidra-source:
    needs: commits
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(needs.commits.outputs.revisions) }}
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the hash-pinned Temurin JDK that the bundle ships
        timeout-minutes: 10
        run: python binaryrat/tools/install_jdk.py --github-env
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - if: runner.os == 'Linux'
        name: Install native source-build prerequisites
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential bison flex zip unzip xvfb xauth
      - name: Download the pinned Gradle distribution, retrying network failures
        timeout-minutes: 15
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          wrapper = str(Path("gradlew.bat" if os.name == "nt" else "gradlew").resolve())
          subprocess.run([sys.executable, "binaryrat/tools/retry_command.py", "--",
                          wrapper, "--version", "--no-daemon"], check=True)
      - if: runner.os == 'Linux'
        name: Fetch upstream source-build dependencies
        timeout-minutes: 20
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse --no-daemon
      - if: runner.os == 'Windows'
        name: Fetch upstream source-build dependencies
        timeout-minutes: 20
        shell: pwsh
        run: .\gradlew.bat -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse --no-daemon
      - if: runner.os == 'Linux'
        name: Build complete Ghidra fork using its pinned Gradle wrapper
        timeout-minutes: 45
        run: ./gradlew buildGhidra --parallel --max-workers=2 --no-daemon
      - if: runner.os == 'Windows'
        name: Build complete Ghidra fork using its pinned Gradle wrapper
        timeout-minutes: 45
        shell: pwsh
        run: .\gradlew.bat buildGhidra --parallel --max-workers=2 --no-daemon
      - name: Prepare the official baseline and this commit's source distribution
        timeout-minutes: 15
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, "-m", "pip", "install", "-r", "binaryrat/requirements-test.txt"], check=True)
          subprocess.run([sys.executable, "binaryrat/tools/fetch_ghidra.py", "--output", "build/ghidra-stock"], check=True)
          archive, = Path("build/dist").glob("ghidra_*.zip")
          dest = Path("build/source-install")
          dest.mkdir()
          extract = (["tar", "-xf", str(archive), "-C", str(dest)] if os.name == "nt"
                     else ["unzip", "-q", str(archive), "-d", str(dest)])
          subprocess.run(extract, check=True)
          candidate, = dest.glob("ghidra_*")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"BINARYRAT_CANDIDATE={candidate.resolve()}", file=env)
      - id: ready
        name: Builds and downloads are complete
        timeout-minutes: 1
        run: echo "Each check below runs unless setup or a check whose output it reads failed."
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Test simultaneous cold reads of calling conventions and settings
        timeout-minutes: 15
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          from xml.etree import ElementTree
          wrapper = Path("gradlew.bat" if os.name == "nt" else "gradlew").resolve()
          reports = Path("Ghidra/Framework/SoftwareModeling/build/test-results/test")
          suites = {
              "ghidra.program.database.data.CallingConventionDBAdapterV0Test":
                  "testColdReadersSeeStoredNameBeforeAndAfterInvalidation",
              "ghidra.program.database.data.SettingsDBAdapterV1Test":
                  "testConcurrentNameLookupOnColdAndReloadedIndex",
          }
          # The preceding source build compiled every processor. These DB tests use an in-memory table.
          command = [str(wrapper), ":SoftwareModeling:test", "-x", ":allSleighCompile",
                     "--max-workers=2", "--no-daemon"]
          for suite in suites:
              (reports / f"TEST-{suite}.xml").unlink(missing_ok=True)
              command.extend(["--tests", suite])
          subprocess.run(command, check=True)
          evidence = Path("build/reports/database-concurrency")
          evidence.mkdir(parents=True, exist_ok=True)
          for suite in suites:
              shutil.copy2(reports / f"TEST-{suite}.xml", evidence)
          # Ghidra configures Gradle to ignore test failures and undiscovered tests.
          for suite, method in suites.items():
              result = ElementTree.parse(reports / f"TEST-{suite}.xml").getroot()
              cases = [(case.get("classname"), case.get("name")) for case in result.findall("testcase")]
              if cases != [(suite, method)] or any(result.find(f".//{tag}") is not None
                                                    for tag in ("failure", "error", "skipped")):
                  raise SystemExit(f"Cold database lookup regression failed: {suite}.{method}")
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Open a saved Ghidra investigation in the source-built fork
        timeout-minutes: 20
        shell: python
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, "binaryrat/benchmarks/verify_project_interop.py",
                          "--stock-ghidra", "build/ghidra-stock/ghidra_12.2_PUBLIC",
                          "--candidate-ghidra", os.environ["BINARYRAT_CANDIDATE"],
                          "--candidate-revision", os.environ["EXPECTED_REVISION"],
                          "--output", "build/reports/project-interop"], check=True)
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Load an unchanged stock-built plugin in the source-built fork
        timeout-minutes: 20
        shell: python
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: |
          import os, subprocess, sys
          display = [] if os.name == "nt" else ["xvfb-run", "-a"]
          subprocess.run([*display, sys.executable, "binaryrat/benchmarks/verify_plugin_compatibility.py",
                          "--stock-ghidra", "build/ghidra-stock/ghidra_12.2_PUBLIC",
                          "--candidate-ghidra", os.environ["BINARYRAT_CANDIDATE"],
                          "--candidate-revision", os.environ["EXPECTED_REVISION"],
                          "--output", "build/reports/plugin-compatibility"], check=True)
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.ready.outcome == 'success' }}
        name: Compare stock and source-built no-return analyzer effects
        timeout-minutes: 25
        shell: bash
        run: |
          python binaryrat/benchmarks/verify_no_return.py --stock-ghidra build/ghidra-stock/ghidra_12.2_PUBLIC --candidate-ghidra "$BINARYRAT_CANDIDATE" --output build/reports/no-return-parity
          python binaryrat/benchmarks/benchmark_no_return.py --stock-ghidra build/ghidra-stock/ghidra_12.2_PUBLIC --candidate-ghidra "$BINARYRAT_CANDIDATE" --output build/reports/no-return-timing --timeout 150
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        name: Check that source-built decompiler output does not depend on decompile order
        timeout-minutes: 20
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, "binaryrat/benchmarks/verify_decompile_order.py",
                          "--stock-ghidra", "build/ghidra-stock/ghidra_12.2_PUBLIC",
                          "--candidate-ghidra", os.environ["BINARYRAT_CANDIDATE"],
                          "--output", "build/reports/decompile-order"], check=True)
      - if: ${{ runner.os == 'Linux' && !cancelled() && steps.ready.outcome == 'success' }}
        name: Run upstream's decompiler unit and data tests on the patched native decompiler
        timeout-minutes: 20
        shell: bash
        run: |
          # The join-flush core patch changes translate.cc, translate.hh and ghidra_process.cc.
          # buildGhidra compiled every processor's .sla in the tree, including the test-only Toy.
          root=build/decompiler-tests
          mkdir -p "$root" build/reports
          cp -r Ghidra/Features/Decompiler/src/decompile/{cpp,unittests,datatests} "$root"/
          cd "$root/cpp"
          # The parsers are generated and checked in; the BFD loader only reads raw files
          # for the interactive console, so the test binary is built without it.
          touch -- *.cc *.hh
          rm -f bfd_arch.cc loadimage_bfd.cc codedata.cc analyzesigs.cc
          sed -i 's/\r$//' ../datatests/*.xml
          make -j2 decomp_test_dbg BFDLIB=
          # Fixture loading failures can be logged without affecting the harness exit status.
          log="$GITHUB_WORKSPACE/build/reports/decompiler-tests.log"
          ./decomp_test_dbg -sleighpath "$GITHUB_WORKSPACE" -path ../datatests 2>&1 | tee "$log"
          python "$GITHUB_WORKSPACE/binaryrat/tools/verify_decompiler_log.py" "$log"
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        id: bundle_parts
        name: Compile and test the bundled engine and extension
        timeout-minutes: 25
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          options = ["-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>"] if os.name == "nt" else []
          subprocess.run(["cmake", "-S", "binaryrat", "-B", "build/bundle-engine", *options], check=True)
          subprocess.run(["cmake", "--build", "build/bundle-engine", "--config", "Release", "--parallel", "2"], check=True)
          subprocess.run(["ctest", "--test-dir", "build/bundle-engine", "-C", "Release", "--output-on-failure",
                          "--timeout", "600"], check=True)
          engine = Path("build/bundle-engine") / ("Release/binaryrat-engine.exe" if os.name == "nt" else "binaryrat-engine")
          wrapper = str(Path("gradlew.bat" if os.name == "nt" else "gradlew").resolve())
          subprocess.run([wrapper, "-p", "binaryrat/bridge", "--no-daemon", "buildExtension",
                          "-PbinaryratEngine=" + str(engine.resolve())],
                         env=os.environ | {"GHIDRA_INSTALL_DIR": os.environ["BINARYRAT_CANDIDATE"]}, check=True)
          subprocess.run([sys.executable, "-m", "pip", "wheel", "--no-deps", "--wheel-dir", "build/bundle-wheels",
                          "./binaryrat/python"], check=True)
      - if: ${{ !cancelled() && steps.bundle_parts.outcome == 'success' }}
        id: bundle
        name: Assemble and test the complete BinaryRat application
        timeout-minutes: 25
        shell: python
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          ghidra, = Path("build/dist").glob("ghidra_*.zip")
          extension, = Path("binaryrat/bridge/dist").glob("BinaryRat-ghidra-*.zip")
          wheel, = Path("build/bundle-wheels").glob("binaryrat-*-py3-none-any.whl")
          walkthrough = Path("binaryrat/distribution/examples/walkthrough.c").resolve()
          example_dir = Path("build/bundle-example")
          example_dir.mkdir()
          example = (example_dir / ("example.exe" if os.name == "nt" else "example")).resolve()
          compile_example = (["cl", "/nologo", "/Od", "/MT", "/Fe:" + str(example), str(walkthrough)]
                             if os.name == "nt" else
                             ["cc", "-std=c11", "-O0", "-s", "-rdynamic", "-o", str(example), str(walkthrough)])
          subprocess.run(compile_example, cwd=example_dir, check=True)
          source = Path("build") / "OpenJDK25U-jdk-sources_25.0.5.1_2.tar.gz"
          subprocess.run([sys.executable, "binaryrat/tools/install_jdk.py", "--sources", str(source)], check=True)
          subprocess.run([sys.executable, "binaryrat/distribution/build_bundle.py", "--ghidra", str(ghidra),
                          "--extension", str(extension), "--jdk", os.environ["JAVA_HOME"], "--jdk-source", str(source),
                          "--revision", os.environ["EXPECTED_REVISION"], "--wheel", str(wheel), "--example", str(example),
                          "--output", "build/binaryrat-dist"], check=True)
          bundle, = Path("build/binaryrat-dist").glob("BinaryRat-*.zip")
          subprocess.run([sys.executable, "binaryrat/distribution/verify_bundle.py", "--archive", str(bundle),
                          "--output", "build/reports/standalone", "--extract-dir", "build/br"], check=True)
          display = [] if os.name == "nt" else ["xvfb-run", "-a"]
          subprocess.run([*display, sys.executable, "binaryrat/distribution/verify_workspace.py",
                          "--bundle", "build/br/BinaryRat", "--output", "build/reports/workspace"], check=True)
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        name: Run bundle tooling and required shared Python service tests
        timeout-minutes: 20
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          for suite in ("binaryrat/distribution", "binaryrat/distribution/tests"):
              subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", suite], check=True)
          bundle = Path("build/br/BinaryRat").resolve()
          ghidra = bundle / "ghidra"
          wheels = ghidra / "Ghidra/Features/PyGhidra/pypkg/dist"
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-index",
                          "--find-links", str(wheels), "--find-links", str(bundle / "python"),
                          "binaryrat[live]"], check=True)
          env = os.environ | {"JAVA_HOME": str(bundle / "jdk"), "JAVA_HOME_OVERRIDE": str(bundle / "jdk"),
                              "BINARYRAT_GHIDRA_INSTALL_DIR": str(ghidra),
                              "BINARYRAT_REQUIRE_SHARED_SERVICE": "1"}
          subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "binaryrat/python/tests",
                          "-p", "test_live*.py", "-v"], env=env, check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaryrat-complete-${{ matrix.os }}-${{ matrix.revision }}
          path: |
            build/binaryrat-dist/BinaryRat-*.zip
            build/binaryrat-dist/BinaryRat-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaryrat-source-build-${{ matrix.os }}-${{ matrix.revision }}
          path: |
            build/dist/ghidra_*.zip
            build/reports
          if-no-files-found: warn
          retention-days: 7
