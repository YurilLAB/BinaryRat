[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binaryrat"
version = "0.1.0"
description = "Experimental typed client for the BinaryRat native engine"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "yurillab"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binaryrat = ["py.typed"]
