import groovy.json.JsonSlurper

def install = providers.gradleProperty('ghidraInstallDir')
    .orElse(providers.environmentVariable('GHIDRA_INSTALL_DIR'))
if (!install.isPresent()) {
    throw new GradleException('Set GHIDRA_INSTALL_DIR to the unpacked Ghidra distribution')
}
def ghidraDir = file(install.get()).canonicalFile
def ghidraBuild = new File(ghidraDir, 'support/buildExtension.gradle')
if (!ghidraBuild.isFile()) {
    throw new GradleException("Ghidra extension build script not found: ${ghidraBuild}")
}

def upstream = new JsonSlurper().parse(file('../UPSTREAM.json'))
def version = upstream.tag.replaceFirst(/^Ghidra_/, '').replaceFirst(/_build$/, '')
def properties = new Properties()
new File(ghidraDir, 'Ghidra/application.properties').withReader { properties.load(it) }
if (properties.getProperty('application.version') != version) {
    throw new GradleException("BinaryRat requires Ghidra ${version}, found " +
        properties.getProperty('application.version'))
}

apply from: ghidraBuild

// Compile the shared implementation once for the desktop, installed scripts,
// and PyGhidra. The checkout still supports stock Ghidra's source-script runner.
tasks.named('compileJava', JavaCompile) {
    source(fileTree('ghidra_scripts/binaryrat') { include '**/*.java' })
}

def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = [amd64: 'x86_64', x86_64: 'x86_64', aarch64: 'arm_64', arm64: 'arm_64'][
    System.getProperty('os.arch')]
def platform = os.startsWith('windows') ? 'win' : (os == 'linux' ? 'linux' : null)
if (!platform || !arch) {
    throw new GradleException('BinaryRat packages require 64-bit Linux or Windows')
}
def osDir = "${platform}_${arch}"
def executableName = platform == 'win' ? 'binaryrat-engine.exe' : 'binaryrat-engine'
def engine = providers.gradleProperty('binaryratEngine').map { file(it).canonicalFile }

tasks.named('buildExtension', Zip) {
    archiveBaseName = "BinaryRat-ghidra-${version}-${osDir}"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    def checksum = destinationDirectory.file(archiveFileName.map { it + '.sha256' })
    outputs.file(checksum)
    def installedScripts = ['BinaryRatReviewLayout.java', 'BinaryRatBrowseLayout.java',
        'BinaryRatProfile.java']
    def shippedScripts = ['BinaryRatExport.java', 'BinaryRatRecoverLayouts.java',
        'BinaryRatRecoverRtti.java'] + installedScripts
    eachFile { entry ->
        if (entry.path.startsWith('BinaryRat/installed_scripts/')) {
            entry.exclude()
        }
        // Only script entrypoints belong here. Shared classes come from BinaryRat.jar.
        if (entry.path.startsWith('BinaryRat/ghidra_scripts/') &&
            !shippedScripts.contains(entry.name)) {
            entry.exclude()
        }
    }
    // These scripts import the extension JAR and run from the installed module.
    from(fileTree('installed_scripts') { include installedScripts }) {
        into 'BinaryRat/ghidra_scripts'
    }
    from(engine) {
        into "BinaryRat/os/${osDir}"
        rename { executableName }
        filePermissions { unix('755') }
    }
    from(files('../../LICENSE', '../../NOTICE')) {
        into 'BinaryRat'
    }
    from(fileTree('../native/third_party') { include '**/LICENSE*' }) {
        into 'BinaryRat/licenses'
    }
    doFirst {
        if (!engine.isPresent() || !engine.get().isFile() || !engine.get().canExecute()) {
            throw new GradleException('Use -PbinaryratEngine=ABSOLUTE_PATH to a built host engine')
        }
    }
    doLast {
        def zip = archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        zip.eachByte(64 * 1024) { buffer, length -> digest.update(buffer, 0, length) }
        // GNU sha256sum binary mode; bind the digest to the portable basename.
        checksum.get().asFile.setText("${HexFormat.of().formatHex(digest.digest())} *${zip.name}\n", 'UTF-8')
    }
}
